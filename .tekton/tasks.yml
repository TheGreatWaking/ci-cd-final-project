apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "正在从 ${WORKSPACE_SOURCE_PATH} 删除所有文件 ..."
        # 如果目录存在，则删除该目录的任何现有内容。
        #
        # 我们不会直接使用 "rm -rf ${WORKSPACE_SOURCE_PATH}"，因为 ${WORKSPACE_SOURCE_PATH} 可能是 "/"
        # 或挂载卷的根目录。
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          # 删除非隐藏文件和目录
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          # 删除以 . 开头的文件和目录，但排除 ..
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          # 删除以 .. 开头的文件和目录以及任何其他字符
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi

---

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  params:
    - name: args
      description: pass the parameters to nose
      type: string
      default: "-v"
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        nosetests $(params.args)